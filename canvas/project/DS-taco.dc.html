<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arctic Taco DS, portrait for Pocket Taco</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;margin:0;padding:0;cursor:pointer}
a{color:#c9ced3}a:hover{color:#e7e9ec}
</style>
</helmet>
<div style="position: relative; width: 414px; height: 896px; overflow: hidden; border-radius: 55px; background: linear-gradient(180deg, {{bodyTop}} 0%, {{bodyBottom}} 100%); font-family: 'Space Grotesk', sans-serif; color: #e7e9ec">

<div aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: 398px; height: 880px; border: 1px solid rgba(255,255,255,0.06); border-radius: 50px"></div>

<div aria-hidden="true" style="position: absolute; left: 24px; top: 24px; width: 7px; height: 7px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 8px {{accent}}"></div>
<div style="position: absolute; left: 37px; top: 21px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">PWR</div>

<div aria-hidden="true" style="position: absolute; left: 7px; top: 42px; width: 400px; height: 304px; border-radius: 18px; background: #050506; border: 1px solid rgba(255,255,255,0.08)"></div>
<div aria-hidden="true" style="position: absolute; left: 71px; top: 344px; width: 272px; height: 206px; border-radius: 16px; background: #050506; border: 1px solid rgba(255,255,255,0.08); border-top-color: transparent"></div>
<div style="position: absolute; left: 15px; top: 50px; width: 384px; height: 288px; border-radius: 8px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 2px">TOP SCREEN</div>
<div style="font-size: 11px; font-weight: 500">384 × 288 · 1.5×</div>
</div>
<div style="position: absolute; left: 79px; top: 352px; width: 256px; height: 192px; border-radius: 6px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<div style="font-size: 10px; font-weight: 700; letter-spacing: 2px">BOTTOM · TOUCH</div>
<div style="font-size: 10px; font-weight: 500">256 × 192 · 1×</div>
</div>

<button aria-label="Menu" style="position: absolute; left: 22px; top: 392px; width: 36px; height: 36px; border-radius: 50%; background: #1f2124; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 2px 6px rgba(0,0,0,0.35); color: #e7e9ec; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"></path></svg>
</button>
<div style="position: absolute; left: 10px; top: 433px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">MENU</div>

<button aria-label="Swap screens" style="position: absolute; left: 22px; top: 464px; width: 36px; height: 36px; border-radius: 50%; background: #1f2124; border: 1.5px solid {{accent}}; box-shadow: 0 2px 6px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15V5M4 8l3-3 3 3M13 5v10M10 12l3 3 3-3"></path></svg>
</button>
<div style="position: absolute; left: 10px; top: 505px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">SWAP</div>

<button aria-label="Fast forward" style="position: absolute; left: 356px; top: 392px; width: 36px; height: 36px; border-radius: 50%; background: #1f2124; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 2px 6px rgba(0,0,0,0.35); color: #e7e9ec; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l6 5-6 5zM10.5 5l6 5-6 5z"></path></svg>
</button>
<div style="position: absolute; left: 344px; top: 433px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">FAST</div>

<button aria-label="Quick save" style="position: absolute; left: 356px; top: 464px; width: 36px; height: 36px; border-radius: 50%; background: #1f2124; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 2px 6px rgba(0,0,0,0.35); color: #e7e9ec; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9M6 8l4 4 4-4M4 15.5h12"></path></svg>
</button>
<div style="position: absolute; left: 344px; top: 505px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">SAVE</div>

<div aria-hidden="true" style="position: absolute; left: 0px; top: 550px; width: 414px; height: 346px; background: repeating-linear-gradient(135deg, rgba(0,0,0,0.42) 0px, rgba(0,0,0,0.42) 10px, rgba(0,0,0,0.30) 10px, rgba(0,0,0,0.30) 20px)"></div>
<div aria-hidden="true" style="position: absolute; left: 0px; top: 550px; width: 414px; height: 0px; border-top: 1px dashed rgba(255,255,255,0.45)"></div>
<div style="position: absolute; left: 0px; top: 562px; width: 414px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #9aa1a8">CONTROLLER COVERS BELOW · Y 550</div>
<div style="position: absolute; left: 0px; top: 720px; width: 414px; text-align: center; padding-left: 4px; font-size: 13px; font-weight: 700; letter-spacing: 4px; color: rgba(255,255,255,0.07)">ARCTIC TACO</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff4d4f","options":["#ff4d4f","#3d8bff","#2fcf74","#ffb020"],"section":"Style"},"tone":{"editor":"enum","default":"black","options":["black","graphite","deep purple"],"section":"Style"},"$preview":{"width":414,"height":896}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = {
      'black': ['#1b1c1f', '#0f1011'],
      'graphite': ['#2c2e33', '#1d1f22'],
      'deep purple': ['#221a2e', '#120e19']
    };
    const t = tones[this.props.tone ?? 'black'] || tones['black'];
    return { accent: this.props.accent ?? '#ff4d4f', bodyTop: t[0], bodyBottom: t[1] };
  }
}
</script>
</body>
</html>
