<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#ffffff","#3ee0d0","#9cff57"],"section":"Style"},"body":{"editor":"enum","default":"taco","options":["taco","taco light","taco dark"],"section":"Style"},"texture":{"editor":"enum","default":"plastic grain","options":["plastic grain","speckle","pebbled","none"],"section":"Style"},"filter":{"editor":"enum","default":"R3BEL mesh","options":["R3BEL mesh","none"],"section":"Screen"},"$preview":{"width":414,"height":896}}'>
class Component extends DCLogic {
  renderVals() {
    const bodies = {
      'taco': ['#dad8d3', '#cdcbc6'],
      'taco light': ['#e4e2dd', '#d8d6d1'],
      'taco dark': ['#cbc9c4', '#bdbbb6']
    };
    const b = bodies[this.props.body ?? 'taco'] || bodies['taco'];
    const mesh = (this.props.filter ?? 'R3BEL mesh') === 'none' ? '' : 'mesh';
    return { accent: this.props.accent ?? '#ffd23f', bodyTop: b[0], bodyBottom: b[1], mesh: mesh, texture: ({'plastic grain': 'tex-grain', 'speckle': 'tex-speckle', 'pebbled': 'tex-pebble'})[this.props.texture ?? 'plastic grain'] || '' };
  }
}
