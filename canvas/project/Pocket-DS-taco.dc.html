<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Taco DS, portrait for Pocket Taco</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;margin:0;padding:0;cursor:pointer}
a{color:#1c1c21}a:hover{color:#4a4844}
.mesh{background-image:url(/_blob/8192c6d469f7ad15c4d10c0ea8475386);background-size:11.553px 11.553px}
.tex-grain{background-image:url(/_blob/4278af5b59bfabbaafc4c035778876d1);background-size:41.08px 41.08px}
.tex-speckle{background-image:url(/_blob/394dbd3bb96d337d5867997fcee5c66c);background-size:41.08px 41.08px}
.tex-pebble{background-image:url(/_blob/9e149dcb5240ae2c905e7a9a060b482e);background-size:82.16px 82.16px}
</style>
</helmet>
<div style="position: relative; width: 414px; height: 896px; overflow: hidden; border-radius: 55px; background: linear-gradient(180deg, {{bodyTop}} 0%, {{bodyBottom}} 100%); font-family: 'Rubik', sans-serif; color: #ffffff">

<div data-role="texture" class="{{texture}}" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 414px; height: 896px; pointer-events: none"></div>

<div data-role="frame" aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: 398px; height: 880px; border: 1px solid rgba(0,0,0,0.08); border-radius: 50px"></div>

<div data-role="led" aria-hidden="true" style="position: absolute; left: 24px; top: 24px; width: 7px; height: 7px; border-radius: 50%; background: #7cff6b; box-shadow: 0 0 8px #7cff6b"></div>
<div data-role="label" style="position: absolute; left: 37px; top: 21px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">PWR</div>

<div data-role="bezel" aria-hidden="true" style="position: absolute; left: 7px; top: 42px; width: 400px; height: 304px; border-radius: 22px; background: #17171b; border: 1px solid rgba(0,0,0,0.30); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.04)"></div>
<div data-role="bezel" aria-hidden="true" style="position: absolute; left: 71px; top: 344px; width: 272px; height: 206px; border-radius: 20px; background: #17171b; border: 1px solid rgba(0,0,0,0.30); border-top-color: transparent"></div>
<div data-role="screen" data-screen="top" style="position: absolute; left: 15px; top: 50px; width: 384px; height: 288px; border-radius: 10px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 2px">TOP SCREEN</div>
<div style="font-size: 11px; font-weight: 500">384 × 288 · 1.5×</div>
</div>
<div data-role="filter" class="{{mesh}}" aria-hidden="true" style="position: absolute; left: 15px; top: 50px; width: 384px; height: 288px; border-radius: 10px; pointer-events: none"></div>
<div data-role="screen" data-screen="bottom" data-touch="true" style="position: absolute; left: 79px; top: 352px; width: 256px; height: 192px; border-radius: 8px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<div style="font-size: 10px; font-weight: 700; letter-spacing: 2px">BOTTOM · TOUCH</div>
<div style="font-size: 10px; font-weight: 500">256 × 192 · 1×</div>
</div>
<div data-role="filter" class="{{mesh}}" aria-hidden="true" style="position: absolute; left: 79px; top: 352px; width: 256px; height: 192px; border-radius: 8px; pointer-events: none"></div>

<button aria-label="Menu" style="position: absolute; left: 22px; top: 392px; width: 36px; height: 36px; border-radius: 50%; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"></path></svg>
</button>
<div data-role="label" style="position: absolute; left: 10px; top: 433px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">MENU</div>

<button aria-label="Swap screens" style="position: absolute; left: 22px; top: 464px; width: 36px; height: 36px; border-radius: 50%; background: {{accent}}; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #1c1c21; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15V5M4 8l3-3 3 3M13 5v10M10 12l3 3 3-3"></path></svg>
</button>
<div data-role="label" style="position: absolute; left: 10px; top: 505px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">SWAP</div>

<button aria-label="Fast forward" style="position: absolute; left: 356px; top: 392px; width: 36px; height: 36px; border-radius: 50%; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l6 5-6 5zM10.5 5l6 5-6 5z"></path></svg>
</button>
<div data-role="label" style="position: absolute; left: 344px; top: 433px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">FAST</div>

<button aria-label="Quick save" style="position: absolute; left: 356px; top: 464px; width: 36px; height: 36px; border-radius: 50%; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9M6 8l4 4 4-4M4 15.5h12"></path></svg>
</button>
<div data-role="label" style="position: absolute; left: 344px; top: 505px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">SAVE</div>

<div data-role="annotation" aria-hidden="true" style="position: absolute; left: 0px; top: 550px; width: 414px; height: 346px; background: repeating-linear-gradient(135deg, rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 10px, rgba(0,0,0,0.04) 10px, rgba(0,0,0,0.04) 20px)"></div>
<div data-role="annotation" aria-hidden="true" style="position: absolute; left: 0px; top: 550px; width: 414px; height: 0px; border-top: 1px dashed rgba(0,0,0,0.45)"></div>
<div data-role="annotation" style="position: absolute; left: 0px; top: 562px; width: 414px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">CONTROLLER COVERS BELOW · Y 550</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#ffffff","#3ee0d0","#9cff57"],"section":"Style"},"body":{"editor":"enum","default":"taco","options":["taco","taco light","taco dark"],"section":"Style"},"texture":{"editor":"enum","default":"plastic grain","options":["plastic grain","speckle","pebbled","none"],"section":"Style"},"filter":{"editor":"enum","default":"R3BEL mesh","options":["R3BEL mesh","none"],"section":"Screen"},"$preview":{"width":414,"height":896}}'>
class Component extends DCLogic {
  renderVals() {
    const bodies = {
      'taco': ['#dad8d3', '#cdcbc6'],
      'taco light': ['#e4e2dd', '#d8d6d1'],
      'taco dark': ['#cbc9c4', '#bdbbb6']
    };
    const b = bodies[this.props.body ?? 'taco'] || bodies['taco'];
    const mesh = (this.props.filter ?? 'R3BEL mesh') === 'none' ? '' : 'mesh';
    return { accent: this.props.accent ?? '#ffd23f', bodyTop: b[0], bodyBottom: b[1], mesh: mesh, texture: ({'plastic grain': 'tex-grain', 'speckle': 'tex-speckle', 'pebbled': 'tex-pebble'})[this.props.texture ?? 'plastic grain'] || '' };
  }
}
</script>
</body>
</html>
