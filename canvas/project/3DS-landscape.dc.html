<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arctic Modern 3DS, landscape</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;margin:0;padding:0;cursor:pointer}
a{color:#c9ced3}a:hover{color:#e7e9ec}
</style>
</helmet>
<div style="position: relative; width: 896px; height: 414px; overflow: hidden; border-radius: 55px; background: linear-gradient(180deg, {{bodyTop}} 0%, {{bodyBottom}} 100%); font-family: 'Space Grotesk', sans-serif; color: #e7e9ec">

<div aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: 880px; height: 398px; border: 1px solid rgba(255,255,255,0.06); border-radius: 52px"></div>

<div aria-hidden="true" style="position: absolute; left: 198px; top: 57px; width: 492px; height: 300px; border-radius: 16px; background: #050506; border: 1px solid rgba(255,255,255,0.08)"></div>
<div style="position: absolute; left: 204px; top: 63px; width: 480px; height: 288px; border-radius: 8px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 2px">TOP SCREEN</div>
<div style="font-size: 11px; font-weight: 500">480 × 288 · 1.2×</div>
</div>

<div aria-hidden="true" style="position: absolute; left: 699px; top: 140px; width: 174px; height: 134px; border-radius: 14px; background: #050506; border: 1px solid rgba(255,255,255,0.08)"></div>
<div style="position: absolute; left: 706px; top: 147px; width: 160px; height: 120px; border-radius: 6px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<div style="font-size: 10px; font-weight: 700; letter-spacing: 2px">TOUCH</div>
<div style="font-size: 10px; font-weight: 500">160 × 120 · 0.5×</div>
</div>

<button aria-label="Menu" style="position: absolute; left: 106px; top: 50px; width: 44px; height: 44px; border-radius: 50%; background: #1f2124; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 2px 6px rgba(0,0,0,0.35); color: #e7e9ec; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"></path></svg>
</button>
<div style="position: absolute; left: 98px; top: 102px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">MENU</div>

<button aria-label="Home" style="position: absolute; left: 106px; top: 170px; width: 44px; height: 44px; border-radius: 50%; background: #1f2124; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 2px 6px rgba(0,0,0,0.35); color: #e7e9ec; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5L10 4l6.5 5.5M5.5 8v8h9V8"></path></svg>
</button>
<div style="position: absolute; left: 98px; top: 222px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">HOME</div>

<div aria-hidden="true" style="position: absolute; left: 124px; top: 299px; width: 8px; height: 8px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 8px {{accent}}"></div>
<div style="position: absolute; left: 98px; top: 313px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">PWR</div>

<button aria-label="Select" style="position: absolute; left: 96px; top: 352px; width: 64px; height: 26px; border-radius: 13px; background: transparent; border: 1px solid rgba(255,255,255,0.16); color: #c9ced3; font-size: 9px; font-weight: 700; letter-spacing: 1.5px">SELECT</button>

<button aria-label="Fast forward" style="position: absolute; left: 760px; top: 50px; width: 44px; height: 44px; border-radius: 50%; background: #1f2124; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 2px 6px rgba(0,0,0,0.35); color: #e7e9ec; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l6 5-6 5zM10.5 5l6 5-6 5z"></path></svg>
</button>
<div style="position: absolute; left: 752px; top: 102px; width: 60px; text-align: center; padding-left: 2px; font-size: 9px; font-weight: 500; letter-spacing: 2px; color: #7d848b">FAST</div>

<button aria-label="Swap screens" style="position: absolute; left: 760px; top: 294px; width: 44px; height: 44px; border-radius: 50%; background: #1f2124; border: 1.5px solid {{accent}}; box-shadow: 0 2px 6px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15V5M4 8l3-3 3 3M13 5v10M10 12l3 3 3-3"></path></svg>
</button>

<button aria-label="Start" style="position: absolute; left: 750px; top: 352px; width: 64px; height: 26px; border-radius: 13px; background: transparent; border: 1px solid rgba(255,255,255,0.16); color: #c9ced3; font-size: 9px; font-weight: 700; letter-spacing: 1.5px">START</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff4d4f","options":["#ff4d4f","#3d8bff","#2fcf74","#ffb020"],"section":"Style"},"tone":{"editor":"enum","default":"black","options":["black","graphite","deep purple"],"section":"Style"},"$preview":{"width":896,"height":414}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = {
      'black': ['#1b1c1f', '#0f1011'],
      'graphite': ['#2c2e33', '#1d1f22'],
      'deep purple': ['#221a2e', '#120e19']
    };
    const t = tones[this.props.tone ?? 'black'] || tones['black'];
    return { accent: this.props.accent ?? '#ff4d4f', bodyTop: t[0], bodyBottom: t[1] };
  }
}
</script>
</body>
</html>
