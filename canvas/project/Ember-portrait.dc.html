<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff8a3d","options":["#ff8a3d","#ffc247","#e8554e","#9bd36a"],"section":"Style"},"body":{"editor":"enum","default":"taco","options":["taco","taco light","taco dark"],"section":"Style"},"filter":{"editor":"enum","default":"LCD grid","options":["LCD grid","scanlines","none"],"section":"Screen"},"$preview":{"width":414,"height":896}}'>
class Component extends DCLogic {
  renderVals() {
    const bodies = {
      'taco': ['#dad8d3', '#cdcbc6'],
      'taco light': ['#e4e2dd', '#d8d6d1'],
      'taco dark': ['#cbc9c4', '#bdbbb6']
    };
    const b = bodies[this.props.body ?? 'taco'] || bodies['taco'];
    return { accent: this.props.accent ?? '#ff8a3d', bodyTop: b[0], bodyBottom: b[1], filterTop: this.fx(384, 288), filterBottom: this.fx(320, 240) };
  }
  fx(w, h) {
    const f = this.props.filter ?? 'LCD grid';
    const cw = w / 256, ch = h / 192;
    if (f === 'none') return 'none';
    if (f === 'scanlines') {
      const t = (ch * 0.35).toFixed(3);
      return `linear-gradient(to bottom, rgba(0,0,0,0.24) 0 ${t}px, transparent ${t}px) 0 0 / 100% ${ch}px`;
    }
    const lw = (cw * 0.2).toFixed(3), lh = (ch * 0.2).toFixed(3);
    return `linear-gradient(to right, rgba(0,0,0,0.2) 0 ${lw}px, transparent ${lw}px) 0 0 / ${cw}px ${ch}px, linear-gradient(to bottom, rgba(0,0,0,0.2) 0 ${lh}px, transparent ${lh}px) 0 0 / ${cw}px ${ch}px`;
  }
}
</script>
