<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff4d4f","options":["#ff4d4f","#3d8bff","#2fcf74","#ffb020"],"section":"Style"},"tone":{"editor":"enum","default":"black","options":["black","graphite","deep purple"],"section":"Style"},"$preview":{"width":414,"height":896}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = {
      'black': ['#1b1c1f', '#0f1011'],
      'graphite': ['#2c2e33', '#1d1f22'],
      'deep purple': ['#221a2e', '#120e19']
    };
    const t = tones[this.props.tone ?? 'black'] || tones['black'];
    return { accent: this.props.accent ?? '#ff4d4f', bodyTop: t[0], bodyBottom: t[1] };
  }
}
</script>
