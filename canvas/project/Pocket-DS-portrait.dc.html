<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket DS, portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;margin:0;padding:0;cursor:pointer}
a{color:#1c1c21}a:hover{color:#4a4844}
.mesh{background-image:url(/_blob/8192c6d469f7ad15c4d10c0ea8475386);background-size:11.553px 11.553px}
.tex-grain{background-image:url(/_blob/4278af5b59bfabbaafc4c035778876d1);background-size:41.08px 41.08px}
.tex-speckle{background-image:url(/_blob/394dbd3bb96d337d5867997fcee5c66c);background-size:41.08px 41.08px}
.tex-pebble{background-image:url(/_blob/9e149dcb5240ae2c905e7a9a060b482e);background-size:82.16px 82.16px}
</style>
</helmet>
<div style="position: relative; width: 414px; height: 896px; overflow: hidden; border-radius: 55px; background: linear-gradient(180deg, {{bodyTop}} 0%, {{bodyBottom}} 100%); font-family: 'Rubik', sans-serif; color: #ffffff">

<div data-role="texture" class="{{texture}}" aria-hidden="true" style="position: absolute; left: 0px; top: 0px; width: 414px; height: 896px; pointer-events: none"></div>

<div data-role="frame" aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: 398px; height: 880px; border: 1px solid rgba(0,0,0,0.08); border-radius: 50px"></div>

<div data-role="led" aria-hidden="true" style="position: absolute; left: 24px; top: 24px; width: 7px; height: 7px; border-radius: 50%; background: #7cff6b; box-shadow: 0 0 8px #7cff6b"></div>
<div data-role="label" style="position: absolute; left: 37px; top: 21px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">PWR</div>

<div data-role="bezel" aria-hidden="true" style="position: absolute; left: 7px; top: 46px; width: 400px; height: 304px; border-radius: 22px; background: #17171b; border: 1px solid rgba(0,0,0,0.30); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.04)"></div>
<div data-role="screen" data-screen="top" style="position: absolute; left: 15px; top: 54px; width: 384px; height: 288px; border-radius: 10px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 2px">TOP SCREEN</div>
<div style="font-size: 11px; font-weight: 500">384 × 288 · 1.5×</div>
</div>
<div data-role="filter" class="{{mesh}}" aria-hidden="true" style="position: absolute; left: 15px; top: 54px; width: 384px; height: 288px; border-radius: 10px; pointer-events: none"></div>

<div data-role="bezel" aria-hidden="true" style="position: absolute; left: 39px; top: 344px; width: 336px; height: 254px; border-radius: 20px; background: #17171b; border: 1px solid rgba(0,0,0,0.30); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.04)"></div>
<div data-role="screen" data-screen="bottom" data-touch="true" style="position: absolute; left: 47px; top: 352px; width: 320px; height: 240px; border-radius: 8px; background: #6e8c8c; color: #0f1717; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">

</div>
<div data-role="filter" class="{{mesh}}" aria-hidden="true" style="position: absolute; left: 47px; top: 352px; width: 320px; height: 240px; border-radius: 8px; pointer-events: none"></div>

<button aria-label="L" style="position: absolute; left: 16px; top: 604px; width: 80px; height: 30px; border-radius: 15px; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; font-size: 14px; font-weight: 700">L</button>
<button aria-label="R" style="position: absolute; left: 318px; top: 604px; width: 80px; height: 30px; border-radius: 15px; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; font-size: 14px; font-weight: 700">R</button>

</button>
<div data-role="label" style="position: absolute; left: 115px; top: 643px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">SAVE</div>

<button aria-label="Fast forward" style="position: absolute; left: 185px; top: 601px; width: 36px; height: 36px; border-radius: 50%; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l6 5-6 5zM10.5 5l6 5-6 5z"></path></svg>
</button>
<div data-role="label" style="position: absolute; left: 173px; top: 643px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">FAST</div>

<button aria-label="Menu" style="position: absolute; left: 243px; top: 601px; width: 36px; height: 36px; border-radius: 50%; background: #1c1c21; border: 0; box-shadow: 0 3px 0 rgba(0,0,0,0.30); color: #ffffff; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"></path></svg>
</button>
<div data-role="label" style="position: absolute; left: 231px; top: 643px; width: 60px; text-align: center; padding-left: 1.5px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; color: #4a4844">MENU</div>

<div data-role="ring" aria-hidden="true" style="position: absolute; left: 20px; top: 650px; width: 160px; height: 160px; border-radius: 50%; background: rgba(0,0,0,0.05)"></div>
<div data-role="dpad" aria-hidden="true" style="position: absolute; left: 77px; top: 660px; width: 46px; height: 140px; border-radius: 10px; background: #1c1c21"></div>
<div data-role="dpad" aria-hidden="true" style="position: absolute; left: 30px; top: 707px; width: 140px; height: 46px; border-radius: 10px; background: #1c1c21"></div>
<button aria-label="D-pad up" style="position: absolute; left: 77px; top: 660px; width: 46px; height: 47px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><path d="M5 2l4 6H1z" fill="#8a8a93"></path></svg>
</button>
<button aria-label="D-pad down" style="position: absolute; left: 77px; top: 753px; width: 46px; height: 47px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center">

</button>
<button aria-label="D-pad left" style="position: absolute; left: 30px; top: 707px; width: 47px; height: 46px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><path d="M2 5l6-4v8z" fill="#8a8a93"></path></svg>
</button>
<button aria-label="D-pad right" style="position: absolute; left: 123px; top: 707px; width: 47px; height: 46px; background: transparent; border: 0; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><path d="M8 5L2 9V1z" fill="#8a8a93"></path></svg>
</button>

<button aria-label="X" style="position: absolute; left: 295px; top: 648px; width: 54px; height: 54px; border-radius: 50%; background: #f4f1ea; border: 0; box-shadow: 0 4px 0 rgba(0,0,0,0.28); color: #1c1c21; font-size: 19px; font-weight: 700">X</button>
<button aria-label="Y" style="position: absolute; left: 240px; top: 703px; width: 54px; height: 54px; border-radius: 50%; background: #f4f1ea; border: 0; box-shadow: 0 4px 0 rgba(0,0,0,0.28); color: #1c1c21; font-size: 19px; font-weight: 700">Y</button>
<button aria-label="A" style="position: absolute; left: 350px; top: 703px; width: 54px; height: 54px; border-radius: 50%; background: {{accent}}; border: 0; box-shadow: 0 4px 0 rgba(0,0,0,0.28); color: #1c1c21; font-size: 19px; font-weight: 700">A</button>
<button aria-label="B" style="position: absolute; left: 295px; top: 758px; width: 54px; height: 54px; border-radius: 50%; background: #2f6bff; border: 0; box-shadow: 0 4px 0 rgba(0,0,0,0.28); color: #ffffff; font-size: 19px; font-weight: 700">B</button>

<button aria-label="Select" style="position: absolute; left: 177px; top: 790px; width: 60px; height: 24px; border-radius: 12px; background: #3a3a40; border: 0; color: #ffffff; font-size: 9px; font-weight: 700; letter-spacing: 1.2px">SELECT</button>
<button aria-label="Start" style="position: absolute; left: 177px; top: 824px; width: 60px; height: 24px; border-radius: 12px; background: #3a3a40; border: 0; color: #ffffff; font-size: 9px; font-weight: 700; letter-spacing: 1.2px">START</button>

<div data-role="slot" aria-hidden="true" style="position: absolute; left: 52px; top: 857px; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22)"></div>
<div data-role="slot" aria-hidden="true" style="position: absolute; left: 350px; top: 846px; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22)"></div>
<div data-role="slot" aria-hidden="true" style="position: absolute; left: 362px; top: 846px; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22)"></div>
<div data-role="slot" aria-hidden="true" style="position: absolute; left: 374px; top: 846px; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22)"></div>
<div data-role="slot" aria-hidden="true" style="position: absolute; left: 356px; top: 857px; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22)"></div>
<div data-role="slot" aria-hidden="true" style="position: absolute; left: 368px; top: 857px; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.22)"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#ffffff","#3ee0d0","#9cff57"],"section":"Style"},"body":{"editor":"enum","default":"taco","options":["taco","taco light","taco dark"],"section":"Style"},"texture":{"editor":"enum","default":"plastic grain","options":["plastic grain","speckle","pebbled","none"],"section":"Style"},"filter":{"editor":"enum","default":"R3BEL mesh","options":["R3BEL mesh","none"],"section":"Screen"},"$preview":{"width":414,"height":896}}'>
class Component extends DCLogic {
  renderVals() {
    const bodies = {
      'taco': ['#dad8d3', '#cdcbc6'],
      'taco light': ['#e4e2dd', '#d8d6d1'],
      'taco dark': ['#cbc9c4', '#bdbbb6']
    };
    const b = bodies[this.props.body ?? 'taco'] || bodies['taco'];
    const mesh = (this.props.filter ?? 'R3BEL mesh') === 'none' ? '' : 'mesh';
    return { accent: this.props.accent ?? '#ffd23f', bodyTop: b[0], bodyBottom: b[1], mesh: mesh, texture: ({'plastic grain': 'tex-grain', 'speckle': 'tex-speckle', 'pebbled': 'tex-pebble'})[this.props.texture ?? 'plastic grain'] || '' };
  }
}
</script>
</body>
</html>
